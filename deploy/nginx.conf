# Tripmates : site public et app, servis par nginx derrière Traefik (Dokploy), qui gère le HTTPS.
# Mêmes règles que vercel.json et le plugin sitePages de vite.config.ts :
#   « / »                                     → index.html (page d'accueil publique)
#   /cgv, /mentions-legales, /confidentialite → pages légales (*.html)
#   toute autre adresse sans extension         → app.html (l'app : /monde, /voyages/…, /invitation/…)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Derrière Traefik : les redirections gardent l'adresse et le protocole d'origine
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain application/xml;

    # Par défaut : pages et fichiers revérifiés à chaque visite (l'app installée se met ainsi à jour)
    include /etc/nginx/snippets/securite.conf;
    add_header Cache-Control "no-cache" always;

    # Vérification de santé (Dokploy, Uptime Kuma)
    location = /sante {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Page d'accueil publique
    location = / {
        try_files /index.html =404;
    }

    # Pages légales, sans « .html » dans l'adresse
    location ~ ^/(cgv|mentions-legales|confidentialite)$ {
        try_files /$1.html =404;
    }

    # Adresses en « .html » : vers l'adresse propre (une seule adresse par page pour le référencement)
    location = /index.html {
        return 301 /;
    }
    location ~ ^/(cgv|mentions-legales|confidentialite)\.html$ {
        return 301 /$1;
    }
    location = /app.html {
        return 301 /monde;
    }

    # Fichiers compilés : leur nom change à chaque version, on les garde un an
    location ^~ /assets/ {
        include /etc/nginx/snippets/securite.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;

        # Lecteur de PDF (worker en .mjs), absent des types connus de nginx
        location ~ \.mjs$ {
            default_type application/javascript;
            include /etc/nginx/snippets/securite.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }
    }

    # Manifeste de l'app installée
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Fichier introuvable (adresse avec une extension) : vraie erreur 404, pas l'app
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    # Tout le reste : un fichier s'il existe (images, icônes, sw.js, robots.txt…), sinon l'app
    location / {
        try_files $uri @app;
    }
    location @app {
        rewrite ^ /app.html break;
    }
}
