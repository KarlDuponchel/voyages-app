# En-têtes de sécurité, inclus dans chaque bloc de deploy/nginx.conf
# (nginx ne transmet pas les add_header d'un niveau supérieur à un bloc qui a les siens)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "geolocation=(), microphone=(), payment=()" always;
